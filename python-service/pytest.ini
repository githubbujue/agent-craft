[pytest]
testpaths = tests
# pytest 默认把 parametrize 里的非 ASCII 转义成 \u4ee5\u540e 这种形式,
# 出发点是很老的终端不能显示中文, 代价是中文用例名彻底不可读。
# 这里放开转义, 让中文用例名原样显示。
# 选项名这么长是 pytest 故意的: 打开它等于放弃对老终端的兼容。
#
# 前提: 输出编码必须是 UTF-8, 否则中文会变成乱码(与转义不同的另一种不可读)。
# Windows 中文环境下 Python 默认按 cp936 写 stdout, 需要 PYTHONUTF8=1
# 让解释器进 UTF-8 模式 —— 这是唯一能在 pytest 建立 capture 之前生效的开关,
# conftest/sitecustomize 都太晚(前者被 capture 抢先, 后者可能被其他工具遮蔽)。
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
